<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE FRAME — slanted multi-panel cover maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1 class="logo">VICE <span>FRAME</span></h1>
    <p class="tagline">Slanted multi-panel cover art from your photos, in a sunset-to-neon grade.</p>

    <section>
      <h2>Photo</h2>
      <label class="open-photo" for="photo-file">Open a photo</label>
      <input id="photo-file" type="file" accept="image/*" hidden>
      <div class="button-row">
        <button type="button" data-sample="pier">Pier</button>
        <button type="button" data-sample="boulevard">Boulevard</button>
        <button type="button" data-sample="beach">Beach</button>
      </div>
      <p class="hint">The photo fills the selected panel. Click a panel on the cover to select it, drag on the cover to pan its photo.</p>
    </section>

    <section>
      <h2>Layout</h2>
      <div class="button-row">
        <button type="button" data-layout="triptych" class="active">Triptych</button>
        <button type="button" data-layout="quad">Quad</button>
        <button type="button" data-layout="duo">Duo</button>
      </div>
      <p class="hint">Selected panel: <span id="selected-panel">Panel 1</span></p>
    </section>

    <section>
      <h2>Frame</h2>
      <label class="field-label" for="zoom">Zoom</label>
      <input id="zoom" type="range" min="1" max="2.5" step="0.01" value="1">
      <label class="field-label" for="grade">Grade</label>
      <input id="grade" type="range" min="0" max="1" step="0.01" value="0.35">
      <div class="range-ends"><span>Sunset</span><span>Neon</span></div>
    </section>

    <section>
      <h2>Caption</h2>
      <label class="field-label" for="caption-title">Title</label>
      <input id="caption-title" type="text" value="NEON SHORES" maxlength="42" autocomplete="off">
      <label class="field-label" for="caption-subtitle">Subtitle</label>
      <input id="caption-subtitle" type="text" value="AN ORIGINAL VICE FRAME COVER" maxlength="60" autocomplete="off">
    </section>

    <section>
      <h2>Export</h2>
      <label class="field-label" for="size">Size</label>
      <select id="size">
        <option value="1080x1080" selected>1080 × 1080 — square post</option>
        <option value="1080x1350">1080 × 1350 — portrait post</option>
        <option value="1920x1080">1920 × 1080 — wide banner</option>
      </select>
      <button id="export" type="button">Export PNG</button>
    </section>
  </aside>

  <main class="stage">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </main>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
